services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: asistencia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: asistencia
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asistencia -d asistencia"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://asistencia:${POSTGRES_PASSWORD}@db:5432/asistencia
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PUERTO:-3000}:3000"

  # Opcional, HTTPS automático con dominio propio: docker compose --profile https up -d --build
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMINIO:-localhost} --to app:3000
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - datos_caddy:/data

volumes:
  datos_pg:
  datos_caddy:
